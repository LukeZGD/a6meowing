name: Build a6xmeowing
on: [push]
jobs:
  a6xmeowing-linux:
    strategy:
      matrix:
        arch:
          - runner: ubuntu-22.04
            name: x86_64
          - runner: ubuntu-22.04-arm
            name: aarch64

    name: a6xmeowing-linux-${{ matrix.arch.name }}
    runs-on: ${{ matrix.arch.runner }}

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y aria2 gcc-arm-none-eabi
          sudo apt remove -y libssl-dev libusb-1.0-0-dev

          aria2c https://github.com/libusb/libusb/releases/download/v1.0.29/libusb-1.0.29.tar.bz2
          tar -xf libusb-1.0.29.tar.bz2
          cd libusb-1.0.29
          ./configure --disable-shared --enable-static --disable-udev LDFLAGS="-static"
          make -j$(nproc)
          sudo make install
          cd ..

      - name: Build a6xmeowing
        run: make

      - name: Zip a6xmeowing
        run: zip -r a6xmeowing_linux-${{ matrix.arch.name }}.zip a6xmeowing

      - name: Update latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload latest \
            a6xmeowing_linux-${{ matrix.arch.name }}.zip \
            --clobber -R ${{ github.repository }}

          gh release edit latest \
            --title "Latest" \
            --target ${{ github.sha }} -R ${{ github.repository }}
